name: build

# Builds APoseFix for Skyrim AE 1.7.104 (Address Library v13 / format 5) and packages
# it as an Amethyst/MO2-installable archive.
#
# Why the packaging step exists: the repo does not ship a ready archive. lib/serdehkx
# has only the FFI header (no .lib), so the Rust staticlib must be built first; and the
# mod also needs meshes/actors/character/behaviors/dummybehavior.hkx - the fallback
# graph the plugin redirects to when a behaviour graph fails to load. That asset lives
# in the released archive, not in this repository, so it is vendored here (repo is
# GPL-3.0) at the same path the mod manager installs it to.
#
# The archive root IS the mod root (SKSE/, meshes/) with no wrapper directory, so a mod
# manager installs it as a single mod. tools/mod_archive.py asserts that, rather than
# assuming it.
#
# Caching: the uncached run took ~21 min, of which xmake's build was 1045s (it compiles
# CommonLibSSE-NG, whose static lib is ~1.4 GB) and the serde_hkx FFI build 180s. Both
# are cached below. The xmake build cache key includes the CommonLibSSE-NG submodule
# revision, because a stale build tree from a different submodule revision would emit a
# DLL with the wrong SKSE declaration - the exact class of silent-wrong-output this
# pipeline exists to prevent.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SERDE_HKX_REPO: https://github.com/SARDONYX-sard/serde-hkx
  SERDE_HKX_SHA: 3f53c0596dd916c964d7efe71fb514cc74430a51

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Report the pinned CommonLibSSE-NG revision
        id: subrev
        shell: bash
        run: |
          set -euo pipefail
          git -C lib/commonlibsse-ng log --oneline -1
          echo "sha=$(git -C lib/commonlibsse-ng rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ~/.xmake holds the fetched/built xmake packages (cmake, ninja, directxmath,
      # directxtk, rapidcsv, spdlog), keyed on the requires lock.
      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake
          key: xmake-pkgs-${{ runner.os }}-${{ hashFiles('xmake.lua', 'xmake-requires.lock', 'xmake-rules.lua') }}
          restore-keys: xmake-pkgs-${{ runner.os }}-

      # Cargo registry/git plus the pinned crate's target dir. The crate is pinned by
      # SHA, so the pinned SHA alone is a complete cache key.
      - name: Cache the Rust FFI build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .deps/serde-hkx/target
          key: cargo-ffi-${{ runner.os }}-${{ env.SERDE_HKX_SHA }}
          restore-keys: cargo-ffi-${{ runner.os }}-

      # Object files and dependency info for the CommonLibSSE-NG + plugin build.
      - name: Cache the xmake build tree
        uses: actions/cache@v4
        with:
          path: build
          key: xmake-build-${{ runner.os }}-${{ steps.subrev.outputs.sha }}-${{ hashFiles('xmake.lua', 'xmake-rules.lua') }}
          restore-keys: xmake-build-${{ runner.os }}-${{ steps.subrev.outputs.sha }}-

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the serde_hkx FFI static library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deps
          if [ ! -d .deps/serde-hkx/.git ]; then
            git clone --quiet "$SERDE_HKX_REPO" .deps/serde-hkx
          fi
          git -C .deps/serde-hkx fetch --quiet origin
          git -C .deps/serde-hkx checkout --quiet "$SERDE_HKX_SHA"
          cargo build --release -p serde_hkx_ffi --manifest-path .deps/serde-hkx/Cargo.toml
          cp .deps/serde-hkx/target/release/serde_hkx_ffi.lib lib/serdehkx/
          ls -l lib/serdehkx/

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          xmake f -y -p windows -a x64 -m releasedbg
          xmake build -y
          ls -l build/windows/x64/releasedbg/ || true

      # "The build succeeded" is not the claim we need. This asserts the exported
      # declaration is well formed and Address-Library independent - and it guards
      # against a stale build cache handing us a DLL from another submodule revision.
      - name: Verify the SKSE version declaration
        shell: bash
        run: python tools/check_skse_version.py build/windows/x64/releasedbg/APoseFix.dll

      - name: Assemble and package the Amethyst-installable mod archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import re;print(re.search(r'local version = \"([^\"]+)\"', open('xmake.lua').read()).group(1))")
          SHORT=$(git rev-parse --short HEAD)
          NAME="APoseFix-${VERSION}-${SHORT}"

          rm -rf staging
          mkdir -p staging/SKSE/Plugins staging/meshes/actors/character/behaviors
          cp build/windows/x64/releasedbg/APoseFix.dll staging/SKSE/Plugins/
          cp meshes/actors/character/behaviors/dummybehavior.hkx staging/meshes/actors/character/behaviors/
          if [ -s ini/Settings.ini ]; then
            mkdir -p staging/SKSE/Plugins/APoseFix
            cp ini/Settings.ini staging/SKSE/Plugins/APoseFix/
          fi

          python tools/mod_archive.py build --stage staging --out "${NAME}.zip" --version "${VERSION}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "zip=${NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Re-verify the produced archive's layout
        shell: bash
        run: |
          set -euo pipefail
          python tools/mod_archive.py check "${{ steps.package.outputs.zip }}"
          sha256sum "${{ steps.package.outputs.zip }}"

      - uses: actions/upload-artifact@v4
        with:
          name: APoseFix-installable
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: APoseFix-pdb
          path: build/windows/x64/releasedbg/APoseFix.pdb
          if-no-files-found: warn

      - name: Attach the archive to a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
