name: build

# Builds APoseFix for Skyrim AE 1.7.104 (Address Library v13 / format 5).
#
# Why this workflow exists: the repo does not build as committed - lib/serdehkx
# ships only the FFI header, not serde_hkx_ffi.lib, so the Rust staticlib has to
# be built first. And the SKSE version declaration is generated by the
# commonlibsse-ng xmake rule from the CommonLibSSE-NG submodule, so the submodule
# revision is what decides whether SKSE will load the DLL at all on 1.7.104.
#
# Pinned to CommonLibSSE-NG 98c8df05f ("fix(skse): set V5 flag in plugin
# declarations"), which makes StructCompatibility::Independent carry
# kVersionIndependentEx_AddressLibraryV5. Without that bit SKSE refuses the plugin
# on 1.7.104.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Report the pinned CommonLibSSE-NG revision
        shell: bash
        run: git -C lib/commonlibsse-ng log --oneline -1

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the serde_hkx FFI static library
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SARDONYX-sard/serde-hkx "$RUNNER_TEMP/serde-hkx"
          git -C "$RUNNER_TEMP/serde-hkx" checkout --quiet 3f53c0596dd916c964d7efe71fb514cc74430a51
          cargo build --release -p serde_hkx_ffi --manifest-path "$RUNNER_TEMP/serde-hkx/Cargo.toml"
          cp "$RUNNER_TEMP/serde-hkx/target/release/serde_hkx_ffi.lib" lib/serdehkx/
          ls -l lib/serdehkx/

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          xmake f -y -p windows -a x64 -m releasedbg
          xmake build -y
          ls -l build/windows/x64/releasedbg/ || true

      # "The build succeeded" is not the claim we need. This asserts the exported
      # declaration actually carries the V5 bit, and fails the job if it does not.
      - name: Verify the SKSE version declaration
        shell: bash
        run: python tools/check_skse_version.py build/windows/x64/releasedbg/APoseFix.dll

      - uses: actions/upload-artifact@v4
        with:
          name: APoseFix-windows-x64
          path: |
            build/windows/x64/releasedbg/*.dll
            build/windows/x64/releasedbg/*.pdb
          if-no-files-found: error
